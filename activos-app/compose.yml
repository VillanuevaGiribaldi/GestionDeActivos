volumes:
  mysql-data:

services:
  activos-db:
    container_name: activos-db
    image: mysql:8.0     
    env_file:
      - .env.database
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
      - 33060:33060
  activos-api:
    container_name: activos-api
    build: 
      context: ./activos-api
    depends_on:
      - activos-db
    env_file:
      - .env.database
      - ./activos-api/.env
      - .env.node
    ports:
      - 3000:3000
      - 35729:35729
    stdin_open: true
    tty: true
    # volumes:
    #   - ./activos-backend:/usr/src/activos-backend/
    develop:
      watch:
        - path: ./activos-api/package.json
          action: rebuild
        - path: ./activos-api/
          target: /usr/src/activos-api/
          action: sync
          ignore:
            - node_modules/ 
  activos-frontend:
    container_name: activos-frontend
    build: 
      context: ./activos-frontend
    env_file:
      - .env.node
      - ./activos-frontend/.env
    ports:
      - 5173:5173
    stdin_open: true
    tty: true
    develop:
      watch:
        - path: ./activos-frontend/package.json
          action: rebuild
        - path: ./activos-frontend/
          target: /usr/src/activos-frontend/
          action: sync
          ignore:
            - node_modules/ 
