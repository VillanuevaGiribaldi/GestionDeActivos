info:
  name: listar
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}{{ruta}}?estado=A"
  params:
    - name: estado
      value: A
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: dados de baja
    request:
      url: "{{host}}{{ruta}}?estado=I"
      method: GET
      params:
        - name: estado
          value: I
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
