info:
  name: listar
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}{{ruta}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: tipos activos
    request:
      url: "{{host}}{{ruta}}?estado=A"
      method: GET
      params:
        - name: estado
          value: A
          type: query
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
